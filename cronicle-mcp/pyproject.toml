[project]
name = "cronicle-mcp"
version = "0.1.0"
description = "MCP server for managing Cronicle (Edge Fork) job scheduler"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.6",
]

[project.scripts]
cronicle-mcp = "cronicle_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cronicle_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
